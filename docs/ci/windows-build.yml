name: Windows build and Unicode checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config RelWithDebInfo
      - name: Unicode tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - name: Reject unrelated hosts
        run: ./tools/test-guards.ps1 -Configuration RelWithDebInfo
      - name: Legacy localization migration
        run: python tests/migration_tests.py
      - name: Persistence evidence validation
        run: python tests/persistence_tests.py
      - name: Native editor evidence validation
        run: python tests/editor_evidence_tests.py
      - name: SDL input evidence validation
        run: python tests/sdl_evidence_tests.py
      - name: Native selection evidence validation
        run: python tests/selection_evidence_tests.py
      - name: Native font lifetime evidence validation
        run: python tests/font_lifetime_evidence_tests.py
      - name: Native editor pixel geometry evidence validation
        run: python tests/geometry_evidence_tests.py
      - name: Native clipboard evidence validation
        run: python tests/clipboard_evidence_tests.py
