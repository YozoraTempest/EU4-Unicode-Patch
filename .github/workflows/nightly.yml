name: Nightly

on:
  workflow_dispatch:
    inputs:
      commit:
        description: develop commit SHA (empty = current develop)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Select develop commit and build date
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:REQUESTED_COMMIT) {
            if ($env:REQUESTED_COMMIT -notmatch '^[0-9a-fA-F]{7,40}$') { throw 'Use a commit SHA from develop.' }
            $commit=git rev-parse --verify --end-of-options "$($env:REQUESTED_COMMIT)^{commit}"
            if ($LASTEXITCODE -ne 0) { throw 'Commit not found.' }
            git merge-base --is-ancestor $commit origin/develop
            if ($LASTEXITCODE -ne 0) { throw 'Commit is not part of develop.' }
            git checkout --detach $commit
            if ($LASTEXITCODE -ne 0) { throw 'Checkout failed.' }
            git submodule update --init --recursive
            if ($LASTEXITCODE -ne 0) { throw 'Submodule checkout failed.' }
          }
          . ./tools/release-common.ps1
          $info=Get-ReleaseInfo Nightly
          "date=$($info.BuildDate)" >> $env:GITHUB_OUTPUT
          "tag=$($info.Tag)" >> $env:GITHUB_OUTPUT
      - name: Check existing release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DATE: ${{ steps.source.outputs.date }}
        run: ./tools/publish-release.ps1 -Channel Nightly -BuildDate $env:BUILD_DATE -CheckOnly
      - name: Build, test and package
        if: steps.preflight.outputs.skip != 'true'
        env:
          BUILD_DATE: ${{ steps.source.outputs.date }}
        run: ./tools/ci.ps1 -Channel Nightly -BuildDate $env:BUILD_DATE
      - name: Save diagnostics
        if: always() && steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ github.run_id }}
          retention-days: 30
          path: |
            build/*.json
            build/*.xml
            build/*.log
            build/*.pdb
            build/*.map
            build/open-font-preview.png
      - name: Publish nightly
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DATE: ${{ steps.source.outputs.date }}
        run: ./tools/publish-release.ps1 -Channel Nightly -BuildDate $env:BUILD_DATE
