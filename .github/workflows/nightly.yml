name: Nightly
on:
  workflow_dispatch:
    inputs:
      commit:
        description: develop commit SHA (empty = current develop)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      date: ${{ steps.select.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - id: select
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: sh tools/select-nightly.sh
  release:
    needs: source
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      source: ${{ needs.source.outputs.commit }}
      channel: Nightly
      build_date: ${{ needs.source.outputs.date }}
