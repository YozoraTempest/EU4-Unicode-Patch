name: CI

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      channel:
        type: string
        default: Release
      build_date:
        type: string
        default: ''
    outputs:
      bundle_artifact:
        value: ${{ jobs.bundle.outputs.artifact_name }}
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arch-core:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 20
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja python git icu file binutils pango cairo fontconfig noto-fonts noto-fonts-cjk ttf-dejavu sdl2-compat
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build and test native Linux plugin and shared core
        run: bash tools/ci-arch-core.sh
      - name: Check native ELF evidence collection
        run: bash tools/inspect-linux-game.sh build/unicode_text_tests build/elf-evidence
      - name: Save Arch environment and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-core-${{ github.sha }}
          retention-days: 14
          path: |
            build/arch-*.txt
            build/ctest-linux-results.xml
            build/ctest-arch-results.xml
            build/Testing/Temporary/LastTest.log
            build/*_tests
            build/libeu4_unicode.so
            build/loader-fixture/eu4
            build/linux-package/**
            build/EU4UnicodePatch-linux-*.tar.gz
            build/linux-package-sha256.txt
            build/linux-build-info.json
            build/EU4UnicodePatch-diagnostics-linux-*.tar.gz
            build/elf-evidence/*.txt
  ubuntu-generic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler_package: gcc-12 g++-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler_package: ''
            cc: gcc
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Install generic Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build python3 git file binutils pkg-config \
            libicu-dev libpango1.0-dev libpangocairo-1.0-0 \
            libfontconfig1-dev libcairo2-dev libharfbuzz-dev libfreetype6-dev \
            fonts-noto-core fonts-noto-cjk fonts-dejavu-core libsdl2-2.0-0 ${{ matrix.compiler_package }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build and test generic Linux plugin
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'Release' }}
          BUILD_DATE: ${{ inputs.build_date || '' }}
        run: bash tools/ci-linux-core.sh
      - name: Save generic Linux package and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-generic-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          path: |
            build/linux-*.txt
            build/ctest-linux-results.xml
            build/Testing/Temporary/LastTest.log
            build/loader-fixture/eu4
            build/linux-package/**
            build/EU4UnicodePatch-linux-*.tar.gz
            build/linux-package-sha256.txt
            build/linux-build-info.json
            build/EU4UnicodePatch-diagnostics-linux-*.tar.gz
  fedora-core:
    needs: ubuntu-generic
    strategy:
      fail-fast: false
      matrix:
        release: ['43', '44']
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:${{ matrix.release }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora runtime dependencies
        run: |
          dnf install -y python3 git binutils tar gzip libstdc++ libicu pango cairo fontconfig sdl2-compat
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Download the Ubuntu 22.04 generic package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-generic-ubuntu-22.04-${{ github.sha }}
          path: build/ubuntu-generic
      - name: Test the unchanged generic package on Fedora
        run: bash tools/test-linux-runtime.sh build/ubuntu-generic build/ubuntu-generic/loader-fixture/eu4 build/generic-runtime
      - name: Install Fedora build dependencies
        run: |
          dnf install -y gcc gcc-c++ cmake ninja-build file pkgconf-pkg-config findutils \
            libicu-devel pango-devel cairo-devel fontconfig-devel harfbuzz-devel freetype-devel \
            google-noto-sans-fonts google-noto-sans-cjk-fonts dejavu-sans-fonts \
            google-noto-sans-arabic-fonts google-noto-sans-hebrew-fonts \
            google-noto-sans-devanagari-fonts google-noto-sans-thai-fonts
      - name: Build and run the complete Linux suite on Fedora
        run: bash tools/ci-linux-core.sh
      - name: Save Fedora tests and generic runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-${{ matrix.release }}-${{ github.sha }}
          retention-days: 14
          path: |
            build/linux-*.txt
            build/ctest-linux-results.xml
            build/Testing/Temporary/LastTest.log
            build/generic-runtime/*.txt
            build/generic-runtime/*.log
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build, test and check player packages
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'Release' }}
          BUILD_DATE: ${{ inputs.build_date || '' }}
        run: pwsh -NoProfile -File ./tools/ci.ps1 -Channel "$RELEASE_CHANNEL" -BuildDate "$BUILD_DATE"
      - name: Save packages and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.sha }}
          retention-days: 14
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            build/*.json
            build/*.xml
            build/*.log
            build/*.pdb
            build/*.map
            build/native_font_atlas_tests.exe
            build/native_font_pages_tests.exe
            build/native_paragraph_tests.exe
            build/localized_format_tests.exe
            build/executable_check.exe
            build/executable_compatibility_tests.exe
            build/legacy_decode.exe
            build/legacy_text_tests.exe
            build/native_name_order_tests.exe
            build/native_mod_registry_tests.exe
            build/native_ime_tests.exe
            build/open-font-preview.png

  bundle:
    needs: [build, ubuntu-generic, arch-core, fedora-core]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.identity.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-${{ github.sha }}
          path: build/windows-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-generic-ubuntu-22.04-${{ github.sha }}
          path: build/linux-artifacts
      - name: Test release gates and draft publication behavior
        run: python3 tests/release_pipeline_tests.py
      - name: Assemble the same-commit cross-platform release
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'Release' }}
          BUILD_DATE: ${{ inputs.build_date || '' }}
        run: |
          python3 tools/release_bundle.py --windows-artifacts build/windows-artifacts \
            --linux-artifacts build/linux-artifacts --output-directory build/release-bundle \
            --channel "$RELEASE_CHANNEL" --build-date "$BUILD_DATE"
      - id: identity
        run: echo "name=release-bundle-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: build/release-bundle/*
          retention-days: 14
