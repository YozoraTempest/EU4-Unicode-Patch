name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build, test and check player packages
        run: pwsh -NoProfile -File ./tools/ci.ps1
      - name: Save packages and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ github.sha }}
          retention-days: 14
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            build/*.json
            build/*.xml
            build/*.log
            build/*.pdb
            build/*.map
            build/native_font_atlas_tests.exe
            build/native_font_pages_tests.exe
            build/executable_check.exe
            build/executable_compatibility_tests.exe
            build/legacy_decode.exe
            build/legacy_text_tests.exe
            build/open-font-preview.png
